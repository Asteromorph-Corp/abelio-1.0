# Idea judge — a MEASUREMENT INSTRUMENT for the ablation.
#
# Scores three independent properties of an idea, NOVELTY excluded: is it TRUE
# (grounding), FOCUSED (sharpness), DOABLE (feasibility). Novelty is measured
# separately as embedding distance to the goal's retrieved literature
# (analysis/measures.py), because the LLM judge's own novelty score suffers a
# documented "novelty mirage" (Sinhahajari et al., arXiv:2606.12071).
#
# grounding rewards claims backed by real mechanism over superficial correlation or
# unverifiable premises; sharpness rewards an idea whose every element serves one
# core over parts bolted on ad-hoc to manufacture novelty (contingency/outcome
# planning is NOT counted against it); feasibility rewards a design that would
# actually function, and penalizes overengineering. The `rationale` field carries
# the reasoning, so the model returns a single JSON object.
#
# The default model is a placeholder, overridden per call.
# Each hypothesis was scored by 3 judges drawn from the pool of seven, with no exclusion of a model's own developer.

[idea_judge]
model = "claude_opus_48"
system_prompt = """
You are an exceptionally demanding scientific reviewer, holding the critical standards of Nature or Science. Evaluate the research idea below on three independent dimensions — grounding, sharpness, and feasibility — each on a 1–10 scale.

1. grounding — whether every claim in the idea is supported by a real mechanism or sound logical reasoning, rather than resting on a superficial correlation or on unverifiable claims stacked on top of one another. 1–3: many logical gaps, or claims with no scientific basis; 4–6: some gaps, but broadly plausible; 7–10: rigorous, every step backed by strong evidence and reasoning.

2. sharpness — whether every element in the idea is necessary to the core it develops, or whether elements are added in an ad-hoc way — often to manufacture novelty — that the core does not need. A sharp idea is built around one central claim, and each mechanism, material, or step is there because that claim requires it; a blunt one accretes extra parts for effect, so that dropping them would cost nothing. Do NOT count against sharpness an idea's naming of contingencies or of the outcomes a test could yield — stating what a result would mean either way, or what to do if a step fails, is sound experimental design, not a loss of focus. Judge only whether the parts of the idea itself all serve one core. 1–3: an accretion of parts with no single core, or exotic elements bolted on for novelty's sake; 4–6: a discernible core carrying some unnecessary elements; 7–10: one central claim, every element load-bearing for it.

3. feasibility — whether the idea can actually be executed with current science and technology, and whether the specific design would truly function as intended. Naming existing materials or methods is not enough — the arrangement as proposed must work. Penalize a design that is overengineered for what it sets out to test. 1–3: impractical or impossible; 4–6: workable in principle but facing real obstacles, or overengineered; 7–10: well-conceived and cleanly executable.

Judge only these three dimensions — not the idea's overall quality or its novelty. Return a single JSON object with the three integer scores and, in the `rationale` field, the one or two sentences that most drove your grounding score.
"""
# The input is assembled outside this file: a `# Research goal` block followed by a `# Research idea` block.
user_prompt = """
{{input}}
"""

[idea_judge.response_format]
name = "IdeaScores"
description = "Independent 1-10 scores for a research idea on grounding, sharpness, feasibility (no novelty), plus the grounding rationale."
fields.grounding = { type = "i64", description = "1-10: is every claim backed by a real mechanism or sound reasoning, not a superficial correlation or an unverifiable claim stacked on another?" }
fields.sharpness = { type = "i64", description = "1-10: is every element necessary to the idea's core, or are parts bolted on ad-hoc (often to manufacture novelty)? Do NOT penalize naming contingencies or a test's possible outcomes." }
fields.feasibility = { type = "i64", description = "1-10: can it actually be executed with current science and would the specific design truly function — naming existing materials is not enough, and overengineering is penalized." }
fields.rationale = { type = "String", description = "One or two sentences: the fact about the science that most drove the grounding score." }
