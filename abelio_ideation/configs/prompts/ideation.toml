proposal_maker_user = """
Now, using provided search tools, check if there were any error in your mechanistic understanding or novelty of selected element(s).
Building on your previous analysis, develop a research proposal that fulfills the research goal by leveraging the selected element. You do not have to use all selected elements, but at least one that is the most plausible and compatible within real biological systems.

Approach to inventing research formulation:
1. Hypothesis and research goal, question cannot be distinguished.
- Remember that enhancing the question context is an integral part of hypothesis generation. Good questions are often more valuable than good answers. Research starts from meaningful questions, not forced novelty or engineered solution.
- You may slightly pivot the provided research goal so that it can fit better with the selected element.

2. From the selected element and your mechanistic analysis, derive an atomic strategy—a single conceptual insight about how to address the research goal.
- Avoid forced/engineered solutions or adding components. The causality you propose must be clear and atomic.
- The inspiration process must be convergence between research goal and selected element, by formulation process.
- Check if all propositions fit within real biological systems. Do not leverage aspects that actually cannot work in real biological systems (e.g., time/size/energy/location constraints, biological compatibility, potency/scalability/practicality of proposed effects, etc.)

3. Build the atomic strategy into a full research proposal.
- Materialize the insight into a concrete possibility.
- Proposed causality must be biologically/logically sound and clearly articulated.
- Check if proposed causality or mechanism is really effective inside the entire system, not just locally effective or overly idealized.

4. Articulate the proposal.
- Articulate as research proposal, not explanation or process description.
- Remove unnecessary adjectives, explanations, or difficult words. Focus on clarity and readability.

In any process, you may return "ideation failed" if you find critical flaws in your previous analysis or if you cannot find any plausible way to build a hypothesis around the selected element(s).

Only output the final research proposal. Do not include any other text, explanation, or analysis.
