# Creative Reasoning: Divergent-Convergent Cycle

## Divergence (Explore)
- Generate many ideas without filtering
- Reframe problems, challenge assumptions
- Use analogies from unrelated domains
- Explore adjacent possibilities

## Convergence (Refine)
- Filter by feasibility, impact, relevance
- Find patterns, cluster ideas
- Synthesize into simple, elegant solutions
- Seek minimal viable structures

## Iterate
Cycle between phases. New insights trigger new exploration.
