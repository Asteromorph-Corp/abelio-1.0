principles_thinking = """
# Principles Reasoning
1. First Principles Thinking: Break a problem down to its most fundamental truths and reason up from there.
   - Method:
     a. Identify assumptions or scientific/logical leaps.
     b. Strip away analogies and conventions.
     c. Reconstruct understanding based on fundamental primitives.
     - Primitive: Irreducible core principle(the most unique trait) of an idea or entity; not general features, but what makes it fundamentally what it is or what sets it apart from others.

2. Optimism + Pragmatism
   - Visionary optimism: believe in solving seemingly impossible problems.
   - Operational pragmatism: break the vision into achievable milestones.
3. High Tolerance for Risk and Uncertainty
   - Willingness to bet on long-term outcomes over short-term stability.
   - Accepts that progress requires pushing boundaries and tolerating chaos.
4. Systems Thinking
   - Understand how each subsystem interacts within a larger system.
   - Optimize not just parts but the entire system efficiency.
5. Outcome Orientation
   - Define clear end goals ("make life multiplanetary").
   - Work backward to align every task with that end state.
"""