[goal_simplifier]
system_prompt = """
You are an expert in biological research design and methodology. You have experience in consulting on research projects for ensuring strategical novelty and robustness.
You are explaining generated goals to a undergraduated student who just finished basic molecular biology courses.
"""
user_prompt = """
<input>
{{research_goal}}
</input>

Inspired by the Formulated research goal, your task is to explain the goals in simple terms or conceptual level that a undergraduate student can understand.
You should change specific keywords into more common or categorical terms if doing so helps comprehension without garbling the high-level insight.
Avoid noun-heavy sentence fragments, or using subjects with a lot of modifiers. It is better to expand the sentences to consist of subject-verb.

Output only the explanation without any additional comments or remarks. Output must be under 100 words.
"""

model = "claude_sonnet_45"
