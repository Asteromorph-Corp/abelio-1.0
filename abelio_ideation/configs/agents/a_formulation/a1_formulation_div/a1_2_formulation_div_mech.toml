[divergent_formulation_mechanism]
system_prompt = "{{config.divergent_formulation_system}}"
user_prompt = """
<input>
{{config.divergent_formulation_input}}
</input>

Task: Generate distinct research goals that target different mechanistic pathways, molecular players, or regulatory networks underlying the phenomenon.

<process>
1. Using the provided search tools, analyze the underlying biological mechanisms involved in the research goal.
- Do not search about how the research goal has been addressed, but focus on understanding the core biological process, mechanism, or system involved.

2. Based on the analysis, break down the mechanistic steps or components involved in the research goal. You may identify:
- Different biological pathways, entities, or levels of which limitation or bottleneck may exist.
- Strategically distinct angles that affect the mechanism. (e.g., aquiring new datas, modalities, technologies, theoretical frameworks, experimental methods, etc.)

3. Synthesize different research goals that address the identified mechanistic components or steps from distinct perspectives.
- Each research goal should clearly contribute to advancing understanding or solving a limitation in the original research goal.
- Ensure that the formulated research goals has no biological flaws or target impossible mechanisms.
- Each research goal should be addressable within a reasonable timeframe (e.g., 1-3 years) and resource constraints typical for academic research projects. Do not desire overly ambitious or vague goals.
</process>

{{config.divergent_formulation_output_format}}
"""

model = "gemini_3_5_flash"
tools = ["builtin.gemini_generate_content/google_search"]

response_format = "custom"
