[package]
name = "rerankers"
description = "The Zerank2 reranker behind the Reranker trait."
version = "1.0.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
async-trait = "0.1"
backoff = { version = "0.4", features = ["tokio"] }
reqwest = { version = "0.13", features = ["json"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
anyhow = "1"
mockito = "1.7"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
