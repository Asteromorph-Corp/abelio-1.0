[summarizer]
system_prompt = ""
user_prompt = """
<input>
{{input}}
</input>

Please create a comprehensive yet concise summary (450-600 words) from the detailed research proposal document above. This summary will be used by another AI agent to understand and reason about the proposal. The summary should capture:

1. The core innovation and what problem it solves
2. The molecular mechanisms involved
3. The success criteria that would validate the approach, and the potential failure modes and fallbacks
4. Other important context about the research concept

Structure your summary to be information-dense and suitable for an agent's working memory. Focus on the content itself and mechanistic details.

The goal is to compress this proposal while retaining all information necessary for technical reasoning, experimental design, and orchestration.

Do not include citations or reference lists in your output. Only the summary text is needed.
"""

model = "claude_sonnet_45"
